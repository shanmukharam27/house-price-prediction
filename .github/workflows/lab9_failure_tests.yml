name: Lab 9 - House Price Failure & Resilience Tests

on:
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Schema Guard & Fault Injection Simulation
        run: python src/simulate_data_corruption.py

      - name: Run Deterministic Reproducibility Test
        run: python pipelines/validate_reproducibility.py

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-price-lab9-evidence-${{ github.run_number }}
          path: |
            artifacts/**
            outputs/**
          if-no-files-found: ignore
